name: Native Meshnet build (experimental)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config protobuf-compiler
          rustup toolchain install 1.99.1 --profile minimal
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Build arm64 JNI bridge
        run: python3 scripts/build-native.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --abi arm64-v8a
      - name: Build and check native-enabled APK
        run: bash gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest -PrequireNative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-arm64-native-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            core/build/reports/
            native/Cargo.lock
            native/Cargo.toml
            native/src/
            docs/NATIVE.md
