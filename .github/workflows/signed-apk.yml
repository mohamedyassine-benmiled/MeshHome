name: Android signed build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config protobuf-compiler
          rustup toolchain install 1.99.1 --profile minimal
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Build pinned arm64 native engine
        run: python3 scripts/build-native.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --abi arm64-v8a
      - name: Materialize signing key on ephemeral runner
        env:
          KEYSTORE_BASE64: ${{ secrets.MESH_HOME_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MESH_HOME_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MESH_HOME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MESH_HOME_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing MESH_HOME_KEYSTORE_BASE64 repository secret.'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing MESH_HOME_KEYSTORE_PASSWORD repository secret.'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing MESH_HOME_KEY_ALIAS repository secret.'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing MESH_HOME_KEY_PASSWORD repository secret.'; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/meshhome-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "MESH_HOME_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Test and build with persistent app signing identity
        env:
          MESH_HOME_KEYSTORE_PASSWORD: ${{ secrets.MESH_HOME_KEYSTORE_PASSWORD }}
          MESH_HOME_KEY_ALIAS: ${{ secrets.MESH_HOME_KEY_ALIAS }}
          MESH_HOME_KEY_PASSWORD: ${{ secrets.MESH_HOME_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash gradlew :core:test :app:testDebugUnitTest :app:lintDebug -PrequireNative
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="0.3.${GITHUB_RUN_NUMBER}"
          fi
          bash gradlew :app:assembleRelease -PrequireNative \
            -PreleaseVersionCode="$VERSION_CODE" \
            -PreleaseVersionName="$VERSION_NAME"
      - name: Prepare tagged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Tag must use semantic version syntax, e.g. v0.4.0.'; exit 1; }
          VERSION="${TAG#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MeshHome-${VERSION}-arm64.apk"
          git archive --format=tar --prefix="MeshHome-${VERSION}/" "$GITHUB_SHA" | gzip -n > "dist/MeshHome-${VERSION}-source.tar.gz"
          UPSTREAM_REVISION="$(git -C vendor/libtelio rev-parse HEAD)"
          git -C vendor/libtelio archive --format=tar --prefix="libtelio-${UPSTREAM_REVISION}/" "$UPSTREAM_REVISION" | gzip -n > "dist/libtelio-${UPSTREAM_REVISION}-source.tar.gz"
          cp native/patches/android-socketpair.patch "dist/MeshHome-${VERSION}-android-socketpair.patch"
          (cd dist && sha256sum "MeshHome-${VERSION}-arm64.apk" "MeshHome-${VERSION}-source.tar.gz" "libtelio-${UPSTREAM_REVISION}-source.tar.gz" "MeshHome-${VERSION}-android-socketpair.patch" > SHA256SUMS)
      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          gh release create "$TAG" \
            "dist/MeshHome-${VERSION}-arm64.apk" \
            "dist/MeshHome-${VERSION}-source.tar.gz" \
            dist/libtelio-*-source.tar.gz \
            "dist/MeshHome-${VERSION}-android-socketpair.patch" \
            dist/SHA256SUMS \
            --title "MeshHome ${VERSION}" \
            --generate-notes \
            --verify-tag
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: MeshHome-${{ github.run_number }}-signed-arm64-build
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
